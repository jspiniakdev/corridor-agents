<!DOCTYPE html>
<!--
  This is a TEMPLATE, not a page meant to be opened directly. The
  EPISODE_DATA placeholder below is filled in by visualize.py before this
  file is written out to experiments/results/visualization.html - opened
  as-is, the const declaration below has an empty right-hand side and the
  page won't work.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corridor Agents - Episode Replay</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1f2937;
    background: #f9fafb;
  }

  h1, h2 { margin-bottom: 0.25rem; }

  #mode-line {
    color: #6b7280;
    margin-bottom: 1.5rem;
  }

  #robot-info {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .robot-card {
    flex: 1;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: white;
    border-left: 5px solid;
  }

  #robot-a-card { border-left-color: #2563eb; }
  #robot-b-card { border-left-color: #d97706; }

  .robot-card h2 { font-size: 1rem; }
  .robot-card .policy { color: #6b7280; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .robot-card .situation { font-size: 0.9rem; margin-bottom: 0.5rem; }
  .robot-card .urgency { font-size: 0.8rem; color: #6b7280; }

  #track-wrapper {
    background: white;
    border-radius: 8px;
    padding: 1.5rem 1rem 1rem 1rem;
    margin-bottom: 1.5rem;
  }

  #status-line {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 0.75rem;
  }

  #current-priority {
    color: #6b7280;
    font-weight: normal;
  }

  #track {
    position: relative;
    height: 130px;
    margin: 0 1rem;
    background: #e5e7eb;
    border-radius: 6px;
  }

  /* Outside the corridor zone, A and B are on separate lanes (top/bottom) -
     they only ever share a lane inside the zone, which is the whole point
     of the zone being exclusive. Lane guides make that visible: two lines
     that run at different heights and only meet inside the tinted zone. */
  .lane-guide {
    position: absolute;
    height: 0;
    border-top: 2px dashed #d1d5db;
  }

  #corridor-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(220, 38, 38, 0.15);
  }

  .boundary {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 2px dashed #9ca3af;
  }

  .robot-marker {
    position: absolute;
    width: 34px;
    height: 34px;
    line-height: 34px;
    text-align: center;
    border-radius: 50%;
    color: white;
    font-weight: bold;
    transform: translate(-50%, -50%);
    transition: left 0.9s linear, top 0.9s linear;
  }

  #marker-a { background: #2563eb; }
  #marker-b { background: #d97706; }

  #action-log {
    margin-top: 0.75rem;
    color: #6b7280;
    font-size: 0.9rem;
  }

  #dialogue-panel, #verdict-panel {
    background: white;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }

  #chat-log {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }

  .message {
    max-width: 80%;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .message.speaker-a { background: #dbeafe; align-self: flex-start; }
  .message.speaker-b { background: #fef3c7; align-self: flex-end; }

  .message .speaker-name { font-weight: bold; font-size: 0.8rem; display: block; }

  #priority-banner {
    font-weight: bold;
  }

  #verdict-text div { margin-bottom: 0.25rem; }

  .correct { color: #16a34a; font-weight: bold; }
  .wrong { color: #dc2626; font-weight: bold; }

  #controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  #controls button {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #controls button:disabled {
    background: #9ca3af;
    cursor: default;
  }

  #restart-button {
    background: #4b5563 !important;
  }
</style>
</head>
<body>

<header>
  <h1 id="scenario-title"></h1>
  <div id="mode-line"></div>
</header>

<section id="robot-info">
  <div class="robot-card" id="robot-a-card">
    <h2>Robot A</h2>
    <div class="policy"></div>
    <div class="situation"></div>
    <div class="urgency"></div>
  </div>
  <div class="robot-card" id="robot-b-card">
    <h2>Robot B</h2>
    <div class="policy"></div>
    <div class="situation"></div>
    <div class="urgency"></div>
  </div>
</section>

<section id="track-wrapper">
  <div id="status-line">
    <span id="tick-label">tick -</span>
    <span id="current-priority">priority: undecided</span>
  </div>
  <div id="track">
    <div id="corridor-zone"></div>
    <div class="lane-guide" id="lane-guide-a-left"></div>
    <div class="lane-guide" id="lane-guide-a-right"></div>
    <div class="lane-guide" id="lane-guide-b-left"></div>
    <div class="lane-guide" id="lane-guide-b-right"></div>
    <div class="boundary" id="a-boundary-marker"></div>
    <div class="boundary" id="b-boundary-marker"></div>
    <div class="robot-marker" id="marker-a">A</div>
    <div class="robot-marker" id="marker-b">B</div>
  </div>
  <div id="action-log"></div>
</section>

<section id="dialogue-panel" hidden>
  <h2>Negotiation</h2>
  <div id="chat-log"></div>
  <div id="priority-banner"></div>
</section>

<section id="verdict-panel" hidden>
  <h2>Result</h2>
  <div id="verdict-text"></div>
</section>

<div id="controls">
  <button id="back-button">Back</button>
  <button id="play-pause-button">Pause</button>
  <button id="next-button">Next</button>
  <button id="restart-button">Restart</button>
</div>

<script>
const EPISODE_DATA = /*__EPISODE_DATA__*/;

const TICK_DELAY_MS = 1000;
const MESSAGE_DELAY_MS = 900;
const DECISION_DELAY_MS = 1500;

// The whole episode is precomputed into a flat list of "frames" - one
// complete snapshot of everything the page should show at that moment.
// Navigation (play/pause/back/next) is then just moving an index into this
// list and re-rendering, which makes "go back" trivial: there's no
// incremental state to undo, every frame already knows how to draw itself
// fully on its own.
let frames = [];
let frameIndex = 0;
let isPlaying = false;
let playTimer = null;

const LANE_A_PERCENT = 25;   // A's own lane, outside the corridor zone
const LANE_B_PERCENT = 75;   // B's own lane, outside the corridor zone
const LANE_SHARED_PERCENT = 50;   // the one-lane bridge, inside the corridor zone

function positionToPercent(position) {
  const grid = EPISODE_DATA.grid;
  return ((position - grid.min_position) / (grid.max_position - grid.min_position)) * 100;
}

function isInZone(position) {
  return EPISODE_DATA.grid.corridor_zone.includes(position);
}

// Phase 3 episodes (visualize.py) have a real synchronized tick - both
// robots' actions decided and applied together each step. Phase 6+
// networked episodes (visualize_network.py) don't - each log entry is one
// robot's independent, serialized commit (D20), so entry.step + a real
// elapsed_ms replace entry.tick + the fixed per-tick delay. Both shapes
// are handled here rather than in two templates, since the rendering is
// otherwise identical.
const USES_STEPS = EPISODE_DATA.log.length > 0 && EPISODE_DATA.log[0].step !== undefined;
const STEP_WORD = USES_STEPS ? "step" : "tick";
const MIN_STEP_DELAY_MS = 300;   // even a near-instant real gap stays visible frame to frame
const MAX_STEP_DELAY_MS = 3000;  // a long negotiation gap doesn't force a multi-second real wait

function entryStep(entry) {
  return USES_STEPS ? entry.step : entry.tick;
}

function stepDelay(entry) {
  if (!USES_STEPS || !entry.elapsed_ms) return TICK_DELAY_MS;
  return Math.min(Math.max(entry.elapsed_ms, MIN_STEP_DELAY_MS), MAX_STEP_DELAY_MS);
}

function buildFrames() {
  const built = [];
  let aPosition = EPISODE_DATA.robots.a.start_position;
  let bPosition = EPISODE_DATA.robots.b.start_position;
  let currentPriority = null;   // undecided until a log entry resolves it

  built.push({
    tickLabel: STEP_WORD + " -",
    aPosition: aPosition,
    bPosition: bPosition,
    aAction: "",
    bAction: "",
    dialogueVisible: false,
    chatMessages: [],
    priorityText: null,
    currentPriority: currentPriority,
    verdictVisible: false,
    delayMs: TICK_DELAY_MS,
  });

  EPISODE_DATA.log.forEach(function (entry) {
    const step = entryStep(entry);
    const isNegotiationTick =
      EPISODE_DATA.negotiation !== null && entryStep(EPISODE_DATA.negotiation) === step;

    if (isNegotiationTick) {
      const messages = EPISODE_DATA.negotiation.messages;

      // one frame per message revealed so far - positions don't change,
      // and priority is still undecided, while the robots are still talking
      for (let shown = 1; shown <= messages.length; shown++) {
        built.push({
          tickLabel: STEP_WORD + " " + step + " - negotiating",
          aPosition: aPosition,
          bPosition: bPosition,
          aAction: "",
          bAction: "",
          dialogueVisible: true,
          chatMessages: messages.slice(0, shown),
          priorityText: null,
          currentPriority: currentPriority,
          verdictVisible: false,
          delayMs: MESSAGE_DELAY_MS,
        });
      }

      // one frame showing the decided priority, before anyone moves
      const negotiation = EPISODE_DATA.negotiation;
      const decisionText = negotiation.agreed
        ? "Priority: " + negotiation.agreed_on
        : "DEADLOCK - no agreement";
      currentPriority = entry.priority;
      built.push({
        tickLabel: STEP_WORD + " " + step + " - negotiating",
        aPosition: aPosition,
        bPosition: bPosition,
        aAction: "",
        bAction: "",
        dialogueVisible: true,
        chatMessages: messages,
        priorityText: decisionText,
        currentPriority: currentPriority,
        verdictVisible: false,
        delayMs: DECISION_DELAY_MS,
      });
    }

    aPosition = entry.a_position;
    bPosition = entry.b_position;
    currentPriority = entry.priority;

    built.push({
      tickLabel: STEP_WORD + " " + step,
      aPosition: aPosition,
      bPosition: bPosition,
      aAction: entry.a_action,
      bAction: entry.b_action,
      dialogueVisible: false,
      chatMessages: [],
      priorityText: null,
      currentPriority: currentPriority,
      verdictVisible: false,
      delayMs: stepDelay(entry),
    });
  });

  built.push(buildVerdictFrame(aPosition, bPosition, currentPriority));

  return built;
}

function buildVerdictFrame(aPosition, bPosition, currentPriority) {
  const lines = [];
  lines.push(EPISODE_DATA.completed ? "episode completed" : "did not complete");
  lines.push("priority: " + (EPISODE_DATA.priority || "none decided"));
  lines.push("should go first: " + (EPISODE_DATA.should_go_first || "tie, no ground truth"));

  let verdictLine = "(no verdict possible)";
  let verdictClass = null;
  if (EPISODE_DATA.correct === true) {
    verdictLine = "(correct)";
    verdictClass = "correct";
  } else if (EPISODE_DATA.correct === false) {
    verdictLine = "(WRONG robot)";
    verdictClass = "wrong";
  }

  return {
    tickLabel: "done",
    aPosition: aPosition,
    bPosition: bPosition,
    aAction: "",
    bAction: "",
    dialogueVisible: false,
    chatMessages: [],
    priorityText: null,
    currentPriority: currentPriority,
    verdictVisible: true,
    verdictLines: lines,
    verdictLine: verdictLine,
    verdictClass: verdictClass,
    delayMs: null,
  };
}

function render(frame) {
  placeMarker("marker-a", frame.aPosition, LANE_A_PERCENT);
  placeMarker("marker-b", frame.bPosition, LANE_B_PERCENT);
  document.getElementById("tick-label").textContent = frame.tickLabel;
  document.getElementById("current-priority").textContent = "priority: " + (frame.currentPriority || "undecided");
  document.getElementById("action-log").textContent =
    (frame.aAction || frame.bAction) ? "A: " + frame.aAction + "   B: " + frame.bAction : "";

  document.getElementById("dialogue-panel").hidden = !frame.dialogueVisible;
  const chatLog = document.getElementById("chat-log");
  chatLog.innerHTML = "";
  frame.chatMessages.forEach(appendChatBubble);
  document.getElementById("priority-banner").textContent = frame.priorityText || "";

  document.getElementById("verdict-panel").hidden = !frame.verdictVisible;
  if (frame.verdictVisible) {
    renderVerdict(frame);
  }

  updateControls();
}

function renderVerdict(frame) {
  const verdictEl = document.getElementById("verdict-text");
  verdictEl.innerHTML = "";
  frame.verdictLines.forEach(function (line) {
    const div = document.createElement("div");
    div.textContent = line;
    verdictEl.appendChild(div);
  });

  const verdictDiv = document.createElement("div");
  verdictDiv.textContent = frame.verdictLine;
  if (frame.verdictClass) {
    verdictDiv.className = frame.verdictClass;
  }
  verdictEl.appendChild(verdictDiv);
}

function appendChatBubble(message) {
  const bubble = document.createElement("div");
  const isA = message.speaker === EPISODE_DATA.robots.a.name;
  bubble.className = "message " + (isA ? "speaker-a" : "speaker-b");

  const speakerLabel = document.createElement("span");
  speakerLabel.className = "speaker-name";
  speakerLabel.textContent = message.speaker + " (" + message.intent + ")";
  bubble.appendChild(speakerLabel);

  const text = document.createElement("span");
  text.textContent = message.text;
  bubble.appendChild(text);

  document.getElementById("chat-log").appendChild(bubble);
}

function fillRobotCard(letter, robot) {
  const card = document.getElementById("robot-" + letter + "-card");
  card.querySelector(".policy").textContent = "policy: " + robot.policy;
  card.querySelector(".situation").textContent = robot.situation;
  card.querySelector(".urgency").textContent = "ground-truth urgency: " + robot.urgency + " (never shown to the policy)";
}

function placeMarker(elementId, position, ownLanePercent) {
  const marker = document.getElementById(elementId);
  marker.style.left = positionToPercent(position) + "%";
  marker.style.top = (isInZone(position) ? LANE_SHARED_PERCENT : ownLanePercent) + "%";
}

function goToFrame(index) {
  frameIndex = Math.max(0, Math.min(index, frames.length - 1));
  render(frames[frameIndex]);
}

function updateControls() {
  document.getElementById("back-button").disabled = frameIndex === 0;
  document.getElementById("next-button").disabled = frameIndex === frames.length - 1;
  document.getElementById("play-pause-button").textContent = isPlaying ? "Pause" : "Play";
}

function stopPlaying() {
  isPlaying = false;
  if (playTimer !== null) {
    clearTimeout(playTimer);
    playTimer = null;
  }
}

function playNextFrame() {
  if (!isPlaying) {
    return;
  }
  if (frameIndex >= frames.length - 1) {
    stopPlaying();
    updateControls();
    return;
  }
  goToFrame(frameIndex + 1);
  if (frameIndex < frames.length - 1) {
    playTimer = setTimeout(playNextFrame, frames[frameIndex].delayMs || TICK_DELAY_MS);
  } else {
    stopPlaying();
    updateControls();
  }
}

function startPlaying() {
  if (frameIndex >= frames.length - 1) {
    goToFrame(0);
  }
  isPlaying = true;
  updateControls();
  playTimer = setTimeout(playNextFrame, frames[frameIndex].delayMs || TICK_DELAY_MS);
}

function init() {
  document.getElementById("scenario-title").textContent = EPISODE_DATA.scenario_id;
  document.getElementById("mode-line").textContent =
    "Robot A: " + EPISODE_DATA.robots.a.policy + "  |  Robot B: " + EPISODE_DATA.robots.b.policy;

  fillRobotCard("a", EPISODE_DATA.robots.a);
  fillRobotCard("b", EPISODE_DATA.robots.b);

  const grid = EPISODE_DATA.grid;
  const zoneStart = Math.min(...grid.corridor_zone);
  const zoneEnd = Math.max(...grid.corridor_zone);
  const zoneStartPercent = positionToPercent(zoneStart);
  const zoneEndPercent = positionToPercent(zoneEnd);

  const zoneEl = document.getElementById("corridor-zone");
  zoneEl.style.left = zoneStartPercent + "%";
  zoneEl.style.width = (zoneEndPercent - zoneStartPercent) + "%";

  setLaneGuide("lane-guide-a-left", 0, zoneStartPercent, LANE_A_PERCENT);
  setLaneGuide("lane-guide-a-right", zoneEndPercent, 100, LANE_A_PERCENT);
  setLaneGuide("lane-guide-b-left", 0, zoneStartPercent, LANE_B_PERCENT);
  setLaneGuide("lane-guide-b-right", zoneEndPercent, 100, LANE_B_PERCENT);

  document.getElementById("a-boundary-marker").style.left = positionToPercent(grid.a_boundary) + "%";
  document.getElementById("b-boundary-marker").style.left = positionToPercent(grid.b_boundary) + "%";

  frames = buildFrames();
  stopPlaying();
  goToFrame(0);
  // Deliberately does not auto-play - the user starts it with the Play
  // button (or steps through with Next) once they're ready.
}

function setLaneGuide(elementId, fromPercent, toPercent, topPercent) {
  const guide = document.getElementById(elementId);
  guide.style.left = fromPercent + "%";
  guide.style.width = (toPercent - fromPercent) + "%";
  guide.style.top = topPercent + "%";
}

document.getElementById("back-button").addEventListener("click", function () {
  stopPlaying();
  goToFrame(frameIndex - 1);
});

document.getElementById("next-button").addEventListener("click", function () {
  stopPlaying();
  goToFrame(frameIndex + 1);
});

document.getElementById("play-pause-button").addEventListener("click", function () {
  if (isPlaying) {
    stopPlaying();
    updateControls();
  } else {
    startPlaying();
  }
});

document.getElementById("restart-button").addEventListener("click", function () {
  stopPlaying();
  goToFrame(0);
  startPlaying();
});

init();
</script>

</body>
</html>
